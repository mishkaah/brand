<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Refined 2-Stop Champagne Gold Gradient (Contrast Ratio 11.4:1 on #09090B) -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5CFA0" />
      <stop offset="100%" stop-color="#B89655" />
    </linearGradient>
  </defs>

  <!-- Pure Matte Obsidian Canvas (#09090B) -->
  <rect width="1024" height="1024" fill="#09090B" />

  <!-- Master Calligraphy Emblem: مِشْكَاة in Diwan Thuluth strictly inside 61% / 66dp Safe Zone -->
  <text x="517" y="616" 
        text-anchor="middle" 
        font-family="'Diwan Thuluth', 'Mishafi', 'Amiri', serif" 
        font-size="340" 
        font-weight="normal" 
        fill="url(#champagneGold)">
    مِشْكَاة
